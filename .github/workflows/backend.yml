name: backend
on:
  push: {branches: [main], paths: ["apps/backend/**", "deploy/backend/**", ".github/workflows/backend.yml"]}
  pull_request: {paths: ["apps/backend/**", "deploy/backend/**", ".github/workflows/backend.yml"]}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17", cache: maven}
      - name: mvn verify（含 jacoco 门 voucher/common LINE ≥60%）
        run: mvn -B -f apps/backend/pom.xml -pl ledgerpilot-admin -am verify
      - name: 干净容器构建冒烟（deploy/backend/Dockerfile）
        run: docker build -f deploy/backend/Dockerfile -t apps/backend-smoke .
