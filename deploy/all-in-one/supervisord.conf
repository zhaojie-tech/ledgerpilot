[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:ai]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/opt/ledgerpilot/ai
environment=LEDGERPILOT_API_TOKEN="%(ENV_LEDGERPILOT_API_TOKEN)s",DEEPSEEK_API_KEY="%(ENV_DEEPSEEK_API_KEY)s",ZHIPU_API_KEY="%(ENV_ZHIPU_API_KEY)s"
autorestart=true

[program:backend]
command=java -jar /opt/ledgerpilot/backend/app.jar --spring.profiles.active=h2 --server.port=8080
environment=JWT_SECRET="%(ENV_JWT_SECRET)s",LEDGERPILOT_API_TOKEN="%(ENV_LEDGERPILOT_API_TOKEN)s"
autorestart=true
startupsecs=25

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
