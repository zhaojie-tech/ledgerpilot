# LedgerPilot 全栈一键部署（demo 档默认：AI 无 key 走规则层，MySQL 自带演示数据）
# 用法：
#   cp deploy/.env.example deploy/.env   # 填 JWT_SECRET（必填）等
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   打开 http://localhost:3000（admin / 123456）
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in deploy/.env}
      MYSQL_DATABASE: ledgerpilot
    volumes:
      - ../apps/backend/ledgerpilot-admin/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../apps/backend/ledgerpilot-admin/src/main/resources/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  ai:
    build: ../apps/ai
    environment:
      # demo 档：全部留空 = AI 规则层兜底（NL 解析可用，无需任何 key）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      LEDGERPILOT_API_TOKEN: ${LEDGERPILOT_API_TOKEN:?}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz')"]
      interval: 30s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ledgerpilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?must be >=32 chars}
      LEDGERPILOT_API_TOKEN: ${LEDGERPILOT_API_TOKEN}
      LEDGERPILOT_INTERNAL_TOKEN: ${LEDGERPILOT_INTERNAL_TOKEN:-}
      AI_SERVICE_BASE_URL: http://ai:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      retries: 10

  front:
    build: ../apps/front
    depends_on:
      - backend
      - ai
    environment:
      BACKEND_UPSTREAM: http://backend:8080
      AI_UPSTREAM: http://ai:8000
      AI_SERVICE_TOKEN: ${LEDGERPILOT_API_TOKEN}
    ports:
      - "3000:80"
