# gitleaks 配置：沿用默认规则 + 锁文件/演示占位符的误报豁免
[extend]
useDefault = true

[allowlist]
description = "锁文件完整性哈希与演示占位符（sha512 高熵 / change-me / bcrypt 演示哈希）"
paths = ['''(^|/)pnpm-lock\.yaml$''']
regexes = [
  '''change-me(-demo-only-32-chars-minimum)?''',
  '''all-in-one-demo''',
  '''\$2b\$10\$[A-Za-z0-9./]{53}''',
]
