# H2 内存库 profile：本地开发/冒烟/测试用（生产请使用 MySQL profile + 外部库）
# 用法：--spring.profiles.active=h2
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:ledgerpilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql

logging:
  level:
    com.ledgerpilot: INFO
